manifest_version = "0"
plugin_version = "0.2.4" # x-release-please-version
# Never below the highest floor in the ci record's closure (compliance_core v0.4.0, pinned in
# boot/ci.boot.json, declares ">=0.2.0"; req-tap-plugin-extdev-repo-ci-7). Raised to 0.3.0
# because plugin CI boots core at this floor, and tap before 0.3.0 cannot boot with FIPS on
# current Wolfi packages (no hashlib md5; the tap#933 apk pins are in 0.3.0).
requires_tap = ">=0.3.0"
slug = "samsite"
name = "Samsite"
description = "Projection plugin for George's live reproduction of Sam Aydlette's static site + FedRAMP 20x compliance machinery (target of the Sam demo)."

# Tier-1 cross-plugin CODE dependencies (load/registration order). These are the
# import-time edges the consistency gate cross-checks against the AST-observed
# `tap_plugin.<other>` imports and the profile install order (deps installed first).
# NOTE: aws_core is deliberately ABSENT — samsite depends on aws_core *data*
# (collector-produced aws_* nodes), not aws_core code; that runtime-data ordering
# stays profile-explicit (fire-collector order) for auditability and is invisible to
# the import graph by design (spec req-plugin-arch-dependencies-3, Tier 2).
depends_on = [
    { slug = "fedramp_20x_ksi", note = "Seeded by the product record: the FedRAMP 20x KSI story the demo tells." },
    { slug = "aws_core", note = "Seeded by the product record: the AWS inventory the demo shows." },
    { slug = "computing_core", note = "Seeded by the product record: the compute vocabulary the demo's grid carries." },
    { slug = "administrivia", note = "Seeded by the product record: the admin pages the frozen demo shows." },
    { slug = "sigstore_core", note = "compliance_collector imports sigstore verify/decompose helpers + models at import time" },
    { slug = "github_core", note = "imports github_core models/panels for the repo + compliance surfaces at import time" },
    { slug = "roscale", note = "imports the OSCAL workbench panel types the compliance pages consume at import time" },
    { slug = "compliance_core", note = "compliance_collector creates compliance_core__compliance_artifact nodes; needs the type registered + boot-ordered ahead" },
    { slug = "identity_core", note = "sigstore_link imports identity_core.issuer to mint the oidc_issuer node + compute its id at import/collection time" },
]

[grift]
keystone = "grift/samsite-keystone.grift.json"
landing = "grift/landing.grift.json"
compliance-landing = "grift/compliance-landing.grift.json"
compliance-pages = "grift/compliance-pages.grift.json"
per-type-viewers = "grift/per-type-viewers.grift.json"
artifacts-inventory-page = "grift/artifacts-inventory-page.grift.json"
ksi-signal-page = "grift/ksi-signal-page.grift.json"
vdr-report-page = "grift/vdr-report-page.grift.json"
iiw-page = "grift/iiw-page.grift.json"
kev-fetch = "grift/kev-fetch.grift.json"
users = "grift/users.grift.json"
samsite-collector-schedule = "grift/samsite-collector-schedule.grift.json"
aws-collector-schedule = "grift/aws-collector-schedule.grift.json"

# In-package boot records (req-boot-bootstrap-records-in-package / -discovery). Digests are
# canonical sha256 (sorted keys, tight separators) — regenerate with
# `scripts/boot-record-hash --refresh` in a checkout core can see, or the shipped
# test_boot_record_resolves suite's digest assertion; never hand-edit. There is deliberately
# NO per-record version: the record's version is this plugin's (req-boot-bootstrap-record-version).
# The samsite record is THE demo profile — fetched by pointer:
#   spawn --from git+https://github.com/unified-systems-com/tap-plugin-samsite@<rev>#samsite
[[boot.records]]
name = "samsite"
description = "Samsite demo end-to-end: full plugin set git-pinned + population (GRIFT seeds, then boto3/github/KSI/samsite-compliance collectors); required_secrets declared for preflight provisioning."
sha256 = "271da57e2c50dbf42d050d8c109a83d014184058d1668e1f5bdebc8df8800e01"

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure + self, offline, credential-free. The consumer flips self to editable."
sha256 = "792a7db0d38db7b73afcbdf210d94babd35478047cd7ba527509797fee10d1bf"
